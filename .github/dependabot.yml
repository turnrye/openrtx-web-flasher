# Proposes updates for the two kinds of pins GitHub understands. The pins in vendor.json
# (cskburn, Emscripten, the device mock-ups, the logo) are updated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
