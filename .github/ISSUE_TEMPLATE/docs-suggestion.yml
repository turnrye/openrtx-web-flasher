# SPDX-License-Identifier: GPL-3.0-or-later
# For people who want to fix or add something on the flasher's pages without editing a
# file themselves. The OpenRTX website has its own repository and issues.
name: Suggest a change to the flasher's pages
description: Fix a mistake, add notes about your radio, or send a photo. No editing needed.
title: 'Pages: '
labels: [docs]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write it in your own words; a maintainer makes the change from what you send.
  - type: input
    id: page
    attributes:
      label: Which page?
      description: Its address, or its title.
      placeholder: https://turnrye.github.io/openrtx-web-flasher/radios/
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: |
        What is wrong or missing, and what it should say. To send photos, drag them onto this box.
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Which radio is it about?
      description: Leave empty if it is not about one radio.
      placeholder: Tytera MD-UV380, hardware version V2
  - type: dropdown
    id: photo-owner
    attributes:
      label: If you sent photos, who took them?
      description: We can only put up photos their owner agrees to.
      options:
        - No photos
        - I took them
        - Someone else took them, and they agree to this
    validations:
      required: true
  - type: dropdown
    id: photo-licence
    attributes:
      label: How may your photos be used?
      description: |
        CC BY-SA 4.0 lets anyone reuse them with your credit, under the same licence. The site's
        text is proposed to use it too. Or keep them for the OpenRTX website only.
      options:
        - No photos
        - CC BY-SA 4.0
        - On the OpenRTX website only, with my credit
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      description: A name or callsign, shown under any photo you sent. Or leave empty.
